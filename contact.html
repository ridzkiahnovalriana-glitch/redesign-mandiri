<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak Kami - Bank Mandiri</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="ridzki_header">
        <a href="index.html" class="ridzki_logo">
            <img src="assets/logo.png" alt="Logo Bank Mandiri">
        </a>
        
        <div class="ridzki_menu_toggle">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <nav id="ridzki_nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">Tentang Kami</a></li>
                <li><a href="services.html">Layanan</a></li>
                <li><a href="livin.html">Livin'</a></li>
                <li><a href="promo.html">Promo</a></li>
                <li><a href="help.html">Bantuan</a></li>
                <li><a href="contact.html">Kontak</a></li>
            </ul>
        </nav>
    </header>

    <div class="ridzki_container">
        <h2 style="color: var(--ridzki-mandiri-blue);">Hubungi Kami</h2>
        <p style="margin-bottom: 1.5rem;">Punya pertanyaan atau masukan? Kirimkan pesan melalui formulir interaktif di bawah ini.</p>
        
        <form id="ridzki_contactForm" style="background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <div class="ridzki_form_group">
                <label for="ridzki_name">Nama Lengkap:</label>
                <input type="text" id="ridzki_name" placeholder="Masukkan nama Anda">
            </div>
            <div class="ridzki_form_group">
                <label for="ridzki_email">Email:</label>
                <input type="email" id="ridzki_email" placeholder="nama@email.com">
            </div>
            <div class="ridzki_form_group">
                <label for="ridzki_message">Pesan:</label>
                <textarea id="ridzki_message" rows="4" placeholder="Tulis pesan atau pertanyaan Anda di sini..."></textarea>
            </div>
            <button type="submit" class="ridzki_btn">Kirim Pesan</button>
            <div id="ridzki_alert"></div>
        </form>
    </div>

    <footer id="ridzki_footer">
        <p>&copy; 2026 Re-Design Bank Mandiri by Ridzki Ahnovalrian Arifin. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
